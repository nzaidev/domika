function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

const Reveal = ({ delay, children, as: Tag = 'div', ...rest }) => {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          el.classList.add('is-visible');
          io.unobserve(el);
        }
      });
    }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return <Tag ref={ref} className={'reveal' + (delay ? ` reveal--delay-${delay}` : '')} {...rest}>{children}</Tag>;
};

const Counter = ({ to, suffix = '', duration = 1600 }) => {
  const [val, setVal] = React.useState(0);
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let raf;
    const io = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) {
        const start = performance.now();
        const tick = (now) => {
          const t = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          setVal(Math.round(to * eased));
          if (t < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        io.disconnect();
      }
    }, { threshold: 0.4 });
    io.observe(el);
    return () => { io.disconnect(); if (raf) cancelAnimationFrame(raf); };
  }, [to, duration]);
  return <span ref={ref}>{val.toLocaleString()}{suffix}</span>;
};

    { key: 'nuevo', label: t.funnel_new, color: '#3B82F6' },
    { key: 'contactado', label: t.funnel_contacted, color: '#6366F1' },
    { key: 'visita', label: t.funnel_visit, color: '#8B5CF6' },
    { key: 'negociacion', label: t.funnel_negotiation, color: '#EC4899' },
    { key: 'cierre', label: t.funnel_closing, color: '#E11D2A' },
  ];

  return (
    <div className="page">
      <Topbar
        title={t.crm_title}
        subtitle={t.crm_sub}
        actions={
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn btn--outline btn--sm"><Icon name="filter" size={14} />{t.crm_filter}</button>
            <button className="btn btn--primary"><Icon name="plus" size={16} />{t.crm_new_lead}</button>
          </div>
        }
      />
      <div className="content">
        <Reveal>
          <div className="kanban">
            {cols.map((c, i) => (
              <div key={c.key} className="kanban__col">
                <div className="kanban__col-head">
                  <div className="kanban__col-pip" style={{ background: c.color }} />
                  <div className="kanban__col-title">{c.label}</div>
                  <span className="kanban__col-count">{LEADS[c.key].length}</span>
                  <button className="kanban__col-add"><Icon name="plus" size={12} /></button>
                </div>
                {LEADS[c.key].map(lead => <LeadCard key={lead.id} lead={lead} t={t} />)}
              </div>
            ))}
          </div>
        </Reveal>
      </div>
    </div>
  );
};

window.Crm = Crm;

// ═══════════════════════════════════════════════════════════
// properties
// ═══════════════════════════════════════════════════════════
const Properties = ({ t, openProperty }) => {
  const [tab, setTab] = React.useState('all');
  const tabs = [
    { id: 'all', label: t.prop_all },
    { id: 'active', label: t.prop_active },
    { id: 'shared', label: t.prop_shared },
    { id: 'draft', label: t.prop_drafts },
  ];
  const filtered = window.PROPERTIES.filter(p => {
    if (tab === 'all') return true;
    if (tab === 'shared') return p.shared;
    return p.status === tab;
  });

  return (
    <div className="page">
      <Topbar
        title={t.prop_title}
        subtitle={t.prop_sub}
        actions={
          <button className="btn btn--primary"><Icon name="plus" size={16} />{t.new_property_btn}</button>
        }
      />
      <div className="content">
        <div className="prop-toolbar">
          <div className="prop-tabs">
            {tabs.map(tb => (
              <button key={tb.id}
                className={'prop-tab' + (tab === tb.id ? ' prop-tab--active' : '')}
                onClick={() => setTab(tb.id)}>
                {tb.label}
              </button>
            ))}
          </div>
          <button className="btn btn--outline btn--sm" style={{ marginLeft: 'auto' }}><Icon name="filter" size={14} /> Filtrar</button>
          <button className="btn btn--ghost btn--icon btn--sm"><Icon name="dots" size={14} /></button>
        </div>

        <div className="prop-grid">
          {filtered.map((p, i) => (
            <Reveal key={p.id} delay={(i % 4) + 1} as="div" className="reveal prop-card" onClick={() => openProperty(p)}>
              <div className="prop-card__photo" style={{ backgroundImage: `url(${p.photo})` }}>
                <div className="prop-card__photo-tags">
                  {p.status === 'active' && <span className="badge badge--success badge--dot">{t.badge_active}</span>}
                  {p.status === 'draft' && <span className="badge badge--warning badge--dot">{t.badge_draft}</span>}
                  {p.shared && <span className="badge badge--info badge--dot">{t.badge_shared}</span>}
                </div>
                <button className="prop-card__fav" onClick={(e) => e.stopPropagation()}><Icon name="heart" size={16} /></button>
                <div className="prop-card__photo-count"><Icon name="photo" size={11} />{p.photos}</div>
              </div>
              <div className="prop-card__body">
                <div className="prop-card__price-row">
                  <div className="prop-card__price">{p.price}</div>
                  <div className="prop-card__type">{p.type}</div>
                </div>
                <div className="prop-card__title">{p.title}</div>
                <div className="prop-card__loc"><Icon name="location" size={12} />{p.loc}</div>
                <div className="prop-card__specs">
                  <div className="prop-spec"><Icon name="bed" size={14} />{p.beds} {t.bedrooms}</div>
                  <div className="prop-spec"><Icon name="bath" size={14} />{p.baths} {t.bathrooms}</div>
                  <div className="prop-spec"><Icon name="sqm" size={14} />{p.sqm} {t.sqm}</div>
                </div>
              </div>
              <div className="prop-card__actions" onClick={(e) => e.stopPropagation()}>
                <button className="btn btn--ghost"><Icon name="brochure" size={12} />{t.prop_action_brochure}</button>
                <button className="btn btn--ghost"><Icon name="share" size={12} />{t.prop_action_share}</button>
                <button className="btn btn--ghost"><Icon name="publish" size={12} />{t.prop_action_publish}</button>
              </div>
            </Reveal>
          ))}
        </div>
      </div>
    </div>
  );
};

window.Properties = Properties;

// ═══════════════════════════════════════════════════════════
// detail
// ═══════════════════════════════════════════════════════════
const Detail = ({ t, property, setRoute }) => {
  const p = property || window.PROPERTIES[0];
  const [shareSettings, setShareSettings] = React.useState({
    photos: true, location: true, owner: false, price: true, brochure: true,
  });
  const toggle = (k) => setShareSettings(s => ({ ...s, [k]: !s[k] }));

  const galleryImgs = [
    p.photo,
    window.PROPERTY_PHOTOS[1],
    window.PROPERTY_PHOTOS[5],
    window.PROPERTY_PHOTOS[2],
    window.PROPERTY_PHOTOS[4],
  ];

  const amenities = [
    { icon: 'pool', label: t.amen_pool },
    { icon: 'cube', label: t.amen_gym },
    { icon: 'shield', label: t.amen_security },
    { icon: 'car', label: t.amen_parking },
    { icon: 'elevator', label: t.amen_elevator },
    { icon: 'building', label: t.amen_terrace },
    { icon: 'wifi', label: t.amen_smart },
    { icon: 'pool', label: t.amen_jacuzzi },
  ];

  return (
    <div className="page">
      <Topbar
        title={p.title}
        subtitle={<><Icon name="location" size={12} style={{ verticalAlign: 'middle' }} /> {p.loc} · {p.type}</>}
        actions={
          <button className="btn btn--ghost btn--sm" onClick={() => setRoute('properties')}>
            <Icon name="arrow_left" size={14} /> {t.detail_back}
          </button>
        }
      />
      <div className="content">
        <div className="detail-grid">
          <div>
            <Reveal>
              <div className="gallery">
                <div className="gallery__img gallery__img--main" style={{ backgroundImage: `url(${galleryImgs[0]})` }} />
                <div className="gallery__img" style={{ backgroundImage: `url(${galleryImgs[1]})` }} />
                <div className="gallery__img" style={{ backgroundImage: `url(${galleryImgs[2]})` }} />
                <div className="gallery__img" style={{ backgroundImage: `url(${galleryImgs[3]})` }} />
                <div className="gallery__img" style={{ backgroundImage: `url(${galleryImgs[4]})`, position: 'relative' }}>
                  <div style={{ position: 'absolute', inset: 0, background: 'rgba(11,27,58,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: 600, fontSize: 14, gap: 6 }}>
                    <Icon name="photo" size={16} /> +{p.photos - 5} fotos
                  </div>
                </div>
              </div>
            </Reveal>

            <Reveal delay={1}>
              <div className="detail__title-block">
                <div className="detail__price-line">
                  <div className="detail__price">{p.price}</div>
                  <span className="badge badge--success badge--dot">{t.badge_active}</span>
                  {p.shared && <span className="badge badge--info badge--dot">{t.badge_shared}</span>}
                </div>
                <div className="detail__title">{p.title}</div>
                <div className="detail__loc"><Icon name="location" size={14} />{p.loc}</div>
              </div>
            </Reveal>

            <Reveal delay={2}>
              <div className="detail__specs-row">
                <div className="detail-spec">
                  <div className="detail-spec__icon"><Icon name="bed" size={20} /></div>
                  <div>
                    <div className="detail-spec__label">{t.detail_specs_label_beds}</div>
                    <div className="detail-spec__value">{p.beds}</div>
                  </div>
                </div>
                <div className="detail-spec">
                  <div className="detail-spec__icon"><Icon name="bath" size={20} /></div>
                  <div>
                    <div className="detail-spec__label">{t.detail_specs_label_baths}</div>
                    <div className="detail-spec__value">{p.baths}</div>
                  </div>
                </div>
                <div className="detail-spec">
                  <div className="detail-spec__icon"><Icon name="sqm" size={20} /></div>
                  <div>
                    <div className="detail-spec__label">{t.detail_specs_label_size}</div>
                    <div className="detail-spec__value">{p.sqm} m²</div>
                  </div>
                </div>
                <div className="detail-spec">
                  <div className="detail-spec__icon"><Icon name="car" size={20} /></div>
                  <div>
                    <div className="detail-spec__label">{t.detail_specs_label_parking}</div>
                    <div className="detail-spec__value">2</div>
                  </div>
                </div>
              </div>
            </Reveal>

            <Reveal delay={2}>
              <div className="panel" style={{ marginBottom: 22 }}>
                <div className="panel__head"><div className="panel__title">{t.detail_about}</div></div>
                <p style={{ color: 'var(--ink-700)', fontSize: 14.5, lineHeight: 1.65, margin: 0 }}>{t.detail_about_text}</p>
              </div>
            </Reveal>

            <Reveal delay={3}>
              <div className="panel">
                <div className="panel__head"><div className="panel__title">{t.detail_amenities}</div></div>
                <div className="amenities">
                  {amenities.map((a, i) => (
                    <div key={i} className="amenity">
                      <Icon name="check" size={14} />{a.label}
                    </div>
                  ))}
                </div>
              </div>
            </Reveal>
          </div>

          <div>
            <Reveal>
              <div className="private-card">
                <div className="private-banner">
                  <Icon name="lock" size={14} />
                  {t.private_banner}
                </div>
                <div style={{ fontSize: 12, color: 'var(--ink-500)', marginBottom: 14 }}>{t.private_sub}</div>

                <div className="owner-row">
                  <div className="owner-row__avatar" style={{ backgroundImage: `url(${window.AVATARS[3]})` }} />
                  <div>
                    <div className="owner-row__name">Eduardo Henríquez</div>
                    <div className="owner-row__role">{t.owner_label} · +1 809 ••• ••42</div>
                  </div>
                  <button className="owner-row__action"><Icon name="phone" size={14} /></button>
                </div>
                <div className="owner-row">
                  <div className="owner-row__avatar" style={{ backgroundImage: `url(${window.AVATARS[0]})` }} />
                  <div>
                    <div className="owner-row__name">Carolina Méndez</div>
                    <div className="owner-row__role">{t.owner_agent_label} · 12% comisión</div>
                  </div>
                  <button className="owner-row__action"><Icon name="phone" size={14} /></button>
                </div>
              </div>
            </Reveal>

            <Reveal delay={1}>
              <div className="share-card">
                <div className="share-card__title">{t.share_title}</div>
                <div className="share-card__sub">{t.share_sub}</div>

                <div className="share-toggle">
                  <div style={{ flex: 1 }}>
                    <div className="share-toggle__label">Mostrar fotos</div>
                    <div className="share-toggle__sub">Galería completa</div>
                  </div>
                  <div className={'toggle-switch' + (shareSettings.photos ? ' is-on' : '')} onClick={() => toggle('photos')} />
                </div>
                <div className="share-toggle">
                  <div style={{ flex: 1 }}>
                    <div className="share-toggle__label">Ubicación exacta</div>
                    <div className="share-toggle__sub">Mostrar en mapa</div>
                  </div>
                  <div className={'toggle-switch' + (shareSettings.location ? ' is-on' : '')} onClick={() => toggle('location')} />
                </div>
                <div className="share-toggle">
                  <div style={{ flex: 1 }}>
                    <div className="share-toggle__label">Datos del propietario</div>
                    <div className="share-toggle__sub">Privado · Sin datos del dueño</div>
                  </div>
                  <div className={'toggle-switch' + (shareSettings.owner ? ' is-on' : '')} onClick={() => toggle('owner')} />
                </div>
                <div className="share-toggle">
                  <div style={{ flex: 1 }}>
                    <div className="share-toggle__label">Precio negociable</div>
                    <div className="share-toggle__sub">Solo visualización</div>
                  </div>
                  <div className={'toggle-switch' + (shareSettings.price ? ' is-on' : '')} onClick={() => toggle('price')} />
                </div>

                <div className="share-actions">
                  <button className="share-action share-action--primary"><Icon name="share" size={14} />{t.share_action_internal}</button>
                  <button className="share-action"><Icon name="send" size={14} />{t.share_action_client}</button>
                  <button className="share-action"><Icon name="brochure" size={14} />{t.share_action_brochure}</button>
                  <button className="share-action"><Icon name="publish" size={14} />{t.share_action_publish}</button>
                  <button className="share-action share-action--whatsapp"><Icon name="whatsapp" size={14} />{t.share_action_whatsapp}</button>
                </div>
              </div>
            </Reveal>
          </div>
        </div>
      </div>
    </div>
  );
};

window.Detail = Detail;

// ═══════════════════════════════════════════════════════════
// app root
// ═══════════════════════════════════════════════════════════
const { useState, useEffect } = React;

const TWEAK_DEFAULS = /*EDITMODE-BEGIN*/{
  "lang": "es"
}/*EDITMODE-END*/;

const App = () => {
  const [route, setRoute] = useState('landing');
  const [property, setProperty] = useState(null);
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULS);
  const t = window.I18N[tweaks.lang] || window.I18N.es;

  const openProperty = (p) => {
    setProperty(p);
    setRoute('detail');
    window.scrollTo(0, 0);
  };

  useEffect(() => { window.scrollTo(0, 0); }, [route]);

  const isLanding = route === 'landing';

  return (
    <>
      <div className={'app' + (isLanding ? ' app--landing' : '')}>
        {!isLanding && <window.Sidebar active={route} setRoute={setRoute} t={t} />}
        <main className="main">
          {route === 'landing' && <window.Landing t={t} setRoute={setRoute} />}
          {route === 'dashboard' && <window.Dashboard t={t} setRoute={setRoute} openProperty={openProperty} />}
          {route === 'leads' && <window.Crm t={t} />}
          {route === 'properties' && <window.Properties t={t} openProperty={openProperty} />}
          {route === 'detail' && <window.Detail t={t} property={property} setRoute={setRoute} />}
          {(route === 'tasks' || route === 'network' || route === 'brochures' || route === 'settings') && (
            <div className="page">
              <window.Topbar title={t['nav_' + route] || route} subtitle="Próximamente" />
              <div className="content">
                <div className="panel" style={{ textAlign: 'center', padding: 80 }}>
                  <div style={{ fontSize: 48, marginBottom: 12 }}>🚧</div>
                  <div style={{ fontFamily: 'var(--font-display)', fontSize: 22, fontWeight: 700 }}>Sección en construcción</div>
                  <div style={{ color: 'var(--ink-500)', marginTop: 8 }}>Esta vista forma parte del roadmap del MVP.</div>
                </div>
              </div>
            </div>
          )}
        </main>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Idioma">
          <TweakRadio
            value={tweaks.lang}
            onChange={(v) => setTweak('lang', v)}
            options={[
              { value: 'es', label: 'Español' },
              { value: 'en', label: 'English' },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
