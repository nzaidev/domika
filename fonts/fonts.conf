<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Minimal fontconfig for serverless flyer rendering: Vercel containers ship
  no fonts, so sharp's SVG rasterizer would draw empty text without this.
  FONTCONFIG_PATH points here (set in src/lib/brochures/flyer.ts).
-->
<fontconfig>
  <dir>/var/task/fonts</dir>
  <cachedir>/tmp/fonts-cache</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Plus Jakarta Sans</family></prefer>
  </alias>
  <alias>
    <family>Helvetica</family>
    <prefer><family>Plus Jakarta Sans</family></prefer>
  </alias>
  <alias>
    <family>Arial</family>
    <prefer><family>Plus Jakarta Sans</family></prefer>
  </alias>
</fontconfig>
